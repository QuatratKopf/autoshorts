name: AutoShorts
run-name: "${{ github.event_name == 'schedule' && 'Stündliche Prüfung' || format('{0} {1}', inputs.action, inputs.category) }}"

on:
  schedule:
    - cron: "17,47 * * * *"   # alle 30 Minuten; der Motor entscheidet selbst, ob ein Video oder neue Zahlen fällig sind
  workflow_dispatch:
    inputs:
      action:
        description: "auto | make | review_make | upload | discard | stats | trends | sounds"
        default: "make"
        type: string
      category:
        description: "Kategorie (leer = Autopilot-Auswahl)"
        default: ""
        type: string
      topic:
        description: "Thema (leer = KI sucht eins aus)"
        default: ""
        type: string
      upload:
        description: "Direkt hochladen (1/0)"
        default: "1"
        type: string
      video_id:
        default: ""
        type: string
      trend:
        default: ""
        type: string
      visual:
        description: "Bildmodus nur für diesen Lauf: ai | toon (leer = Einstellung)"
        required: false
      look:
        description: "Bildstil nur für diesen Lauf: cartoon | neon (leer = Einstellung)"
        required: false

permissions:
  contents: write

concurrency:
  group: autoshorts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IN_ACTION: ${{ inputs.action || 'auto' }}
      IN_CATEGORY: ${{ inputs.category }}
      IN_TOPIC: ${{ inputs.topic }}
      IN_UPLOAD: ${{ inputs.upload || '1' }}
      IN_ID: ${{ inputs.video_id }}
      IN_TREND: ${{ inputs.trend }}
      AS_VISUAL: ${{ inputs.visual }}
      AS_LOOK: ${{ inputs.look }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # immer der neueste Stand – wartende Läufe würden sonst mit alten Daten arbeiten und Videos überschreiben

      - name: Ist etwas zu tun?
        id: check
        run: python3 -m engine.schedule >> "$GITHUB_OUTPUT"

      - name: Python einrichten
        if: steps.check.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Pakete installieren
        if: steps.check.outputs.run == '1'
        run: pip install -q -r engine/requirements.txt

      - name: Sprach-Abgleich installieren (Untertitel exakt zur Stimme)
        if: steps.check.outputs.media == '1'
        run: pip install -q faster-whisper || echo "Sprach-Abgleich nicht verfügbar – es wird geschätzt"

      - name: Sprachmodell zwischenspeichern
        if: steps.check.outputs.media == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: ffmpeg und Schrift installieren
        if: steps.check.outputs.media == '1'
        run: |
          # ffmpeg: erst der Paketdienst mit kurzer Geduld (hing schon einmal 20 Minuten), sonst ein fertiges Paket von GitHub
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true"
          if ! command -v ffmpeg >/dev/null; then
            (timeout 120 sudo apt-get $APT update -qq && timeout 180 sudo apt-get $APT install -y -qq ffmpeg > /dev/null) \
              || echo "Paketdienst zu langsam – nehme das fertige ffmpeg-Paket"
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 3 --max-time 240 -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            sudo cp /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          fi
          ffmpeg -hide_banner -version | head -1
          mkdir -p .fonts
          for w in SemiBold Bold ExtraBold; do
            curl -fsSL --retry 3 --max-time 60 -o .fonts/Poppins-$w.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf
          done
          curl -fsSL --retry 3 --max-time 60 -o .fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || echo "Anton nicht geladen – Untertitel in Poppins"

      - name: Node für HyperFrames einrichten
        if: steps.check.outputs.media == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: HyperFrames installieren (Grafik-Einschübe als HTML-Animation)
        if: steps.check.outputs.media == '1'
        run: timeout 240 npm install -g --no-fund --no-audit hyperframes@0.9.34 || echo "HyperFrames nicht verfügbar – Grafiken werden wie bisher gezeichnet"

      - name: Klang-Bibliothek einrichten (earshot, nur für die Aktion „sounds“)
        if: steps.check.outputs.run == '1' && env.IN_ACTION == 'sounds'
        run: |
          # earshot (MIT) auf einem geprüften Stand; die Sound-Bank braucht nur numpy/scipy – keine KI-Modelle, kein torch
          pip install -q numpy scipy soundfile soxr
          pip install -q --no-deps "git+https://github.com/Leonxlnx/earshot@4ac3d2ac2b151e1c23376f9ce7f3047a17050013"

      - name: AutoShorts ausführen
        if: steps.check.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FONTS_DIR: ${{ github.workspace }}/.fonts
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          python -m engine.main "$IN_ACTION" \
            --category "$IN_CATEGORY" --topic "$IN_TOPIC" --upload "$IN_UPLOAD" \
            --id "$IN_ID" --trend "$IN_TREND"

      - name: Ergebnis speichern
        if: ${{ !cancelled() && steps.check.outputs.run == '1' }}
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/state.json docs/data/videos.json docs/data/stats.json docs/data/trends.json docs/thumbs tokens
          git add docs/data/wishes.json docs/data/shapes.json docs/data/plans.json docs/data/insights.json docs/data/scripts 2>/dev/null || true
          if [ "$IN_ACTION" = "sounds" ]; then git add assets/sfx music 2>/dev/null || true; fi
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -q -m "AutoShorts: $IN_ACTION"
          for i in 1 2 3 4 5; do
            # Bei gleichzeitigen Läufen gewinnt der neueste Stand dieses Laufs (Daten-Dateien werden komplett neu geschrieben)
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
