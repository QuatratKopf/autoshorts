name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, requests, json, time
          k=os.environ["K"]; B="https://generativelanguage.googleapis.com/v1beta"
          user=('Schreibe ein deutsches Kurzvideo-Drehbuch (ca. 150 Wörter) zum Thema "Was wäre, wenn die Sonne ausgeht?" als JSON: '
                '{"title":"..","scenes":[{"text":"..","place":"bedroom","actors":[{"id":"a","action":"talk"}],"overlay":null}]} mit genau 12 Szenen.')
          def run(m, tc):
              gc={"temperature":0.9,"responseMimeType":"application/json","maxOutputTokens":8192}
              if tc: gc["thinkingConfig"]=tc
              t=time.time()
              try:
                  r=requests.post(f"{B}/models/{m}:generateContent",headers={"x-goog-api-key":k},json={"contents":[{"role":"user","parts":[{"text":user}]}],"generationConfig":gc},timeout=150)
                  dt=time.time()-t
                  if r.status_code!=200: print("###",m,tc,r.status_code,round(dt,1),r.text[:200].replace("\n"," ")); return
                  js=r.json(); c=js["candidates"][0]; txt="".join(p.get("text","") for p in c["content"].get("parts",[]) if not p.get("thought"))
                  try: n=len(json.loads(txt)["scenes"]); ok=True
                  except Exception as e: n=str(e)[:40]; ok=False
                  u=js.get("usageMetadata",{})
                  print("###",m,tc,200,round(dt,1),"s","valid" if ok else "INVALID",n,c.get("finishReason"),"thoughts",u.get("thoughtsTokenCount"),"out",u.get("candidatesTokenCount"))
              except Exception as e: print("###",m,tc,"ERR",type(e).__name__,round(time.time()-t,1))
          for m in ("gemini-flash-latest","gemini-3.8-flash","gemini-3.5-flash","gemini-flash-lite-latest","gemini-3.5-flash-lite"):
              for tc in ({"thinkingLevel":"low"},{"thinkingLevel":"minimal"},{"thinkingBudget":0},None):
                  run(m,tc)
          PY
