<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AutoShorts · Verbinden</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f3f4f7;--surface:#fff;--line:#d9dce5;--fg:#161a24;--muted:#5d6475;--accent:#2f5bd3;--pos:#0f8a72;--neg:#d2493f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10131b;--surface:#171b26;--line:#2a3040;--fg:#e7e9ef;--muted:#9097a8;--accent:#7b9cff;--pos:#3cc4a4;--neg:#f2766b;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px}
img{width:44px;height:44px;border-radius:11px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted)}
a{color:var(--accent)}
.ok{color:var(--pos)} .err{color:var(--neg)}
</style>
</head>
<body>
<div class="card">
  <img src="icon.svg" alt="">
  <h1 id="h">Verbinde …</h1>
  <p id="p">Einen Moment.</p>
  <p><a href="./#einstellungen">Zurück zur App</a></p>
</div>
<script>
(async()=>{
  const q=new URLSearchParams(location.search), h=document.getElementById("h"), p=document.getElementById("p");
  const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const fail=(t,m)=>{h.textContent=t;h.className="err";p.textContent=m};
  let saved={}; try{saved=JSON.parse(LS("as_oauth")||"{}")}catch(e){}
  const token=LS("as_token"); let repo={}; try{repo=JSON.parse(LS("as_repo")||"{}")}catch(e){}
  const owner=repo.owner||location.hostname.split(".")[0], name=repo.repo||location.pathname.split("/").filter(Boolean)[0];
  if(q.get("error")) return fail("Abgebrochen", q.get("error_description")||q.get("error"));
  if(!q.get("code")) return fail("Kein Code erhalten","Bitte in der App erneut auf „Verbinden“ tippen.");
  if(!saved.state||saved.state!==q.get("state")) return fail("Sicherheitsprüfung fehlgeschlagen","Bitte die Verbindung in der App neu starten.");
  if(!token) return fail("App nicht verbunden","Öffne zuerst die App auf diesem Gerät und verbinde sie mit GitHub.");
  const redirect=location.origin+location.pathname;
  const label=saved.platform==="youtube"?"YouTube":"TikTok";
  try{
    const r=await fetch(`https://api.github.com/repos/${owner}/${name}/actions/workflows/autoshorts.yml/dispatches`,{method:"POST",
      headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"},
      body:JSON.stringify({ref:"main",inputs:{action:"connect",platform:saved.platform,code:q.get("code"),redirect}})});
    if(!r.ok) throw new Error("GitHub meldet "+r.status);
    try{localStorage.removeItem("as_oauth");localStorage.setItem("as_msg",label+" wird verbunden – das dauert etwa eine Minute.")}catch(e){}
    history.replaceState(null,"",location.pathname);
    h.textContent=label+" wird verbunden";h.className="ok";
    p.textContent="Der Auftrag läuft jetzt auf GitHub (ca. 1 Minute). Du wirst gleich zurückgeleitet.";
    setTimeout(()=>location.href="./#einstellungen",2500);
  }catch(e){fail("Konnte den Auftrag nicht starten",e.message)}
})();
</script>
</body>
</html>
