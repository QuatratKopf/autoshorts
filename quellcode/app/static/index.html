<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoShorts</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#efeef2">
<script>try{var t=localStorage.getItem("as-theme");if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Stil wie FVG Trader 3.0: hell & minimal, Pill-Navigation, weiche Karten, Verlauf-Akzent, Dunkelmodus */
:root{
  --bg:#efeef2; --surface:#ffffff; --raise:#f7f7f9; --sunk:#f2f1f5; --line:#e8e7ed; --line2:#dad9e1; --fg:#121215; --muted:#86858f;
  --ink:#121215; --ink-fg:#ffffff;
  --accent:#f0562b; --accent2:#ff8a4c; --accent-fg:#fff; --pos:#13a052; --neg:#e5484d; --warn:#d97a06; --fill:rgba(240,86,43,.10);
  --pos-bg:rgba(19,160,82,.09); --neg-bg:rgba(229,72,77,.09); --warn-bg:rgba(217,122,6,.11);
  --grad:linear-gradient(135deg,#ff8a4c 0%,#f0562b 55%,#e1401f 100%);
  --shadow:0 1px 2px rgba(18,18,21,.04),0 10px 30px -14px rgba(18,18,21,.12);
  --shadow-h:0 2px 4px rgba(18,18,21,.05),0 22px 44px -18px rgba(18,18,21,.22);
  --glass:rgba(255,255,255,.86);
  --yt:#f0562b; --tt:#121215;
  --r:22px; --r-s:14px; --ease:cubic-bezier(.22,.8,.24,1);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0b0b0d; --surface:#161618; --raise:#1c1c1f; --sunk:#121214; --line:#242428; --line2:#323238; --fg:#f2f2f4; --muted:#8c8c95;
  --ink:#f2f2f4; --ink-fg:#111113;
  --accent:#ff6a3d; --accent2:#ff9a5c; --pos:#3cc97f; --neg:#ff6369; --warn:#f5a524; --fill:rgba(255,106,61,.13);
  --pos-bg:rgba(60,201,127,.11); --neg-bg:rgba(255,99,105,.11); --warn-bg:rgba(245,165,36,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6);
  --shadow-h:0 2px 4px rgba(0,0,0,.35),0 24px 48px -18px rgba(0,0,0,.75);
  --glass:rgba(22,22,24,.88);
  --yt:#ff6a3d; --tt:#f2f2f4;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;transition:background-color .4s var(--ease)}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.mono,td{font-variant-numeric:tabular-nums}
code,.code{font-family:var(--f-code)}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)} ::-webkit-scrollbar-track{background:transparent}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .warn{color:var(--warn)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Kopfzeile ── */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 15.5px var(--f-body);letter-spacing:-.02em}
.brand img{width:34px;height:34px;border-radius:11px;box-shadow:0 6px 16px -6px rgba(47,91,211,.6)}
.nav{position:relative;display:flex;gap:2px;padding:5px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);border:1px solid var(--line)}
.nav-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--ink);transition:left .45s var(--ease),width .45s var(--ease),opacity .2s;pointer-events:none;z-index:0;opacity:0}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:8px 15px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:500 13.5px var(--f-body);letter-spacing:-.01em;white-space:nowrap;transition:color .3s var(--ease)}
.nav button svg{display:none;width:18px;height:18px}
.nav button:hover{color:var(--fg)}
.nav button[aria-current=true]{color:var(--ink-fg);font-weight:600}
.nav button em{display:none}
.bar-r{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.icgrp{display:flex;align-items:center;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;padding:0;position:relative;transition:background .2s,transform .2s var(--ease)}
.ib:hover{background:var(--sunk)} .ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px}
.ib .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;box-shadow:0 0 0 2px var(--surface)}

/* ── Seitenkopf ── */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:18px 0 4px}
.phead h1{margin:0;font:600 clamp(26px,3.4vw,40px)/1.1 var(--f-body);letter-spacing:-.035em}
.phead h1 .w{display:inline-block;white-space:pre;animation:word .8s var(--ease) both;animation-delay:calc(var(--w,0)*80ms)}
.phead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.status{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:5px 11px;color:var(--fg);box-shadow:var(--shadow);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);display:inline-block}
.dot.ok{background:var(--pos);box-shadow:0 0 0 3px var(--pos-bg)} .dot.bad{background:var(--neg);box-shadow:0 0 0 3px var(--neg-bg)} .dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.banner{border-radius:var(--r-s);padding:12px 16px;background:var(--warn-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.run{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.banner.ok{background:var(--pos-bg);border-color:color-mix(in srgb,var(--pos) 25%,transparent)}
.banner.bad{background:var(--neg-bg);border-color:color-mix(in srgb,var(--neg) 25%,transparent)}
.banner a{font-weight:600}
.spin{width:15px;height:15px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px;padding-bottom:60px}

/* ── Grundbausteine ── */
h2{font:600 16.5px/1.3 var(--f-body);letter-spacing:-.02em;margin:0}
h3{letter-spacing:-.01em}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;min-width:0;display:flex;flex-direction:column;gap:12px;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.lift:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.empty{color:var(--muted);font-size:13px;padding:18px;border:1.5px dashed var(--line2);border-radius:var(--r-s);text-align:center}
.btn{border-radius:999px;padding:8px 16px;font:500 13px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line2);transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ink-fg);font-weight:600}
.btn.primary:hover:not(:disabled){box-shadow:0 8px 20px -8px color-mix(in srgb,var(--ink) 60%,transparent)}
.btn.accent{background:var(--grad);border:0;color:#fff;font-weight:600;box-shadow:0 8px 20px -10px rgba(240,86,43,.8)}
.btn.danger{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.btn.danger:hover{background:var(--neg)!important;color:#fff;border-color:var(--neg)!important}
.btn.sm{padding:5px 11px;font-size:12px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;min-width:0;transition:border-color .2s,box-shadow .2s;width:100%}
textarea{resize:vertical;min-height:70px;font-size:13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--fg) 8%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ink)}
.chip{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--fg);white-space:nowrap;text-decoration:none}
.chip.good{background:var(--pos-bg);color:var(--pos)} .chip.bad{background:var(--neg-bg);color:var(--neg)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.mute{background:var(--sunk);color:var(--muted)} .chip.acc{background:var(--fill);color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;border-radius:999px;padding:6px 13px;font:500 12.5px var(--f-body);color:var(--muted);background:transparent;transition:background .3s var(--ease),color .3s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:500;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:13px;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.t,td.t{text-align:left}
td.w{white-space:normal}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s} tbody tr:hover td{background:var(--raise)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.gl{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ── Dashboard-Hero ── */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.1fr) minmax(0,1.15fr);gap:18px}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.hero-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hc-top span{font-size:13.5px;font-weight:500}
.hc-top small{font-size:12px;color:var(--muted)}
.bal{font:600 clamp(30px,3.2vw,40px)/1.05 var(--f-body);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.delta b{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600}
.delta b.pos{background:var(--pos-bg)} .delta b.neg{background:var(--neg-bg)} .delta b.zero{background:var(--sunk);color:var(--muted)}
.hb-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.hb-act .btn{padding:12px 14px;font-weight:600}
.wal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--raise);border-radius:var(--r-s);padding:8px;border:1px solid var(--line)}
.wal>div{background:var(--surface);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.wal span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.wal span i{width:8px;height:8px;border-radius:50%}
.wal b{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.tile-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.tile-h i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--fg)}
.tile-h i svg{width:14px;height:14px}
.tile b{font:600 clamp(24px,2.4vw,30px)/1.1 var(--f-body);letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.tile small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small em{font-style:normal;font-weight:600;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--fg)}
.tile.hot{background:var(--grad);border:0;color:#fff;box-shadow:0 18px 36px -18px rgba(240,86,43,.85);position:relative;overflow:hidden}
.tile.hot::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.tile.hot .tile-h,.tile.hot small{color:rgba(255,255,255,.85)}
.tile.hot .tile-h i{background:rgba(255,255,255,.2);color:#fff}
.tile.hot small em{background:rgba(255,255,255,.22);color:#fff}
.bars-box{flex:1;display:flex;flex-direction:column;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 12px 8px;min-height:190px}
.bars-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.bars-h b{color:var(--fg);font-weight:600;font-size:13px}
.bars{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:stretch;min-height:130px;position:relative}
.bars .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.bars .stk{position:relative;width:min(100%,26px);flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.bars .s1,.bars .s2{border-radius:7px;transform-origin:bottom;animation:growUp .9s var(--ease) both;animation-delay:calc(var(--k,0)*45ms + .15s)}
.bars .s1{background:var(--ink)}
.bars .s2{background:repeating-linear-gradient(-45deg,var(--accent) 0 3px,color-mix(in srgb,var(--accent) 55%,transparent) 3px 6px);margin-top:2px}
.bars .col.ph .stk{border-radius:7px;background:repeating-linear-gradient(0deg,transparent 0 6px,var(--line) 6px 7px);opacity:.6}
.bars .col small{font-size:10px;color:var(--muted);white-space:nowrap}
.bars .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translate(-50%,4px);background:var(--ink);color:var(--ink-fg);font-size:11px;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:3}
.bars .col:hover .tip{opacity:1;transform:translate(-50%,0)}
.bars .col:nth-last-child(-n+3) .tip{left:auto;right:0;transform:translate(0,4px)} .bars .col:nth-last-child(-n+3):hover .tip{transform:translate(0,0)}
.bars .col:nth-child(-n+3) .tip{left:0;transform:translate(0,4px)} .bars .col:nth-child(-n+3):hover .tip{transform:translate(0,0)}
@keyframes growUp{from{transform:scaleY(0)}}
@media (max-width:1180px){ .hero{grid-template-columns:1fr 1fr} .hero .hero-card:last-child{grid-column:1/-1} }
@media (max-width:720px){ .hero{grid-template-columns:1fr} .hero .hero-card:last-child{grid-column:auto} }
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:12px;align-items:center}
.hbar-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.hbar-l b{font-weight:600;font-size:13.5px} .hbar-l small{font-size:11.5px;color:var(--muted)}
.hbar-t{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.hbar-t i{display:block;height:100%;border-radius:999px;background:var(--ink);transform-origin:left;animation:growX .9s var(--ease) both}
.hbar:first-child .hbar-t i{background:var(--grad)}
@keyframes growX{from{transform:scaleX(0)}}
.hbar>span{font-size:13px;font-weight:600;text-align:right;min-width:64px}
.thumb{width:36px;height:64px;border-radius:8px;object-fit:cover;display:block;flex:none;background:var(--sunk)}
.vrow{display:flex;gap:12px;align-items:center;min-width:0}
.vrow .tt{display:flex;flex-direction:column;gap:4px;min-width:0}
.vrow .tt b{font-weight:600;white-space:normal}
.vrow .tt div{display:flex;gap:4px;flex-wrap:wrap}
.runs{display:flex;flex-direction:column}
.runs div{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.runs div:last-child{border-bottom:0}

/* ── Kalender ── */
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-mon{display:flex;align-items:center;gap:6px}
.cal-mon h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 8px 0 2px}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;background:var(--surface);color:var(--fg);padding:0;transition:border-color .2s,transform .2s var(--ease)}
.ibtn:hover{border-color:var(--fg)} .ibtn:active{transform:scale(.92)}
.ibtn svg{width:16px;height:16px}
.strip{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.strip>div{padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip .l{font-size:11px;color:var(--muted);font-weight:500}
.strip .v{font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.strip .big{font-size:28px;letter-spacing:-.03em}
.strip .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} .strip>div{border-left:0;border-top:1px solid var(--line)} .strip>div:first-child{grid-column:1/-1;border-top:0} .strip>div:nth-child(odd):not(:first-child){border-left:1px solid var(--line)} }

function armed(btn, q, fn) { if (btn.dataset.sure === "1") return fn(); btn.dataset.sure = "1"; const t = btn.textContent; btn.textContent = q; setTimeout(() => { btn.dataset.sure = ""; btn.textContent = t; }, 4000); }

addEventListener("message", async e => {

  toast(e.data.title + ". Die Zahlen kommen in etwa einer Minute.");
  ST.connected = ST.connected || {}; if (e.data.platform) ST.connected[e.data.platform] = ST.connected[e.data.platform] || {name: ""};
  S = await api("/api/state"); render(); pollRuns();

/* ═════════════════ Updates ═════════════════ */
async function runUpdate() {
  const before = S.version;
  document.body.insertAdjacentHTML("beforeend", `<div id="updOv" style="position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div style="text-align:center;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:center"><span class="spin" style="width:26px;height:26px;border-width:3px"></span>
      <h2 style="font-size:20px" id="updT">Update wird geladen …</h2><p class="hint" id="updMsg">Die neue Version wird heruntergeladen und geprüft.</p><div id="updAct"></div></div></div>`);
  const msg = (t, m, act) => { $("#updT").textContent = t; $("#updMsg").innerHTML = m; $("#updAct").innerHTML = act || ""; };
  let res;
  try { res = await api("/api/update/apply", {}); } catch (e) {
    $("#updOv .spin").remove(); msg("Update fehlgeschlagen", esc(e.message), '<button class="btn" id="updClose">Schließen</button>'); $("#updClose").onclick = () => $("#updOv").remove(); return; }
  const target = res && res.version;
  msg("Neustart …", `Version <b>${esc(target || "neu")}</b> ist installiert. AutoShorts startet neu, das dauert ein paar Sekunden.`);
  const t0 = Date.now();
  let kills = 0;
  const poll = async () => {
    const secs = (Date.now() - t0) / 1000;
    try {
      const r = await fetch("/api/state", {cache: "no-store"});
      if (r.ok) {
        const j = await r.json();
        if (j.version !== before) { location.reload(); return; }
        if (secs > 12 && kills < 5) {   // eine alte Instanz antwortet noch: beenden, die neue übernimmt
          kills++;
          msg("Räume auf …", "Eine ältere AutoShorts-Instanz läuft noch im Hintergrund und wird beendet.");
          try { await fetch("/api/shutdown", {method: "POST", headers: {"X-AS": "1", "Content-Type": "application/json"}, body: "{}"}); } catch (e) {}
        }
      }
    } catch (e) {}
    if (secs > 75) {
      $("#updOv .spin")?.remove();
      msg("Update installiert ✓", `Version <b>${esc(target || "neu")}</b> ist installiert.<br>Schließ dieses Fenster und starte AutoShorts über das <b>Desktop-Symbol</b>.`,
        '<button class="btn" id="updRetry">Erneut verbinden</button>');
      $("#updRetry").onclick = () => location.reload(); return;
    }
    setTimeout(poll, 1000);
  };
  setTimeout(poll, 2000);
}
async function startupUpdatePrompt() {
  let u; try { u = await api("/api/update/check", {}); } catch (e) { return; }
  S.update = u; banner();
  if (!u.available) return;
  try { if (sessionStorage.getItem("as-upd") === u.version) return; sessionStorage.setItem("as-upd", u.version); } catch (e) {}
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="updAsk"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="uaT">
    <h2 id="uaT" style="font-size:19px">Update verfügbar</h2>
    <p style="margin:0">Version <b>${esc(u.version)}</b> ist da (installiert: ${esc(S.version)}).${u.notes ? `<br><span class="hint">${esc(u.notes)}</span>` : ""}</p>
    <p class="hint">Jetzt aktualisieren? Deine Einstellungen und Videos bleiben erhalten.</p>
    <div class="actions"><button class="btn primary" id="uaY">Ja, jetzt aktualisieren</button><button class="btn" id="uaN">Später</button></div></div></div>`);

  render(true); pollRuns();
  setTimeout(startupUpdatePrompt, 1500);
  setInterval(async () => { if (document.hidden) return; await loadData(); if (!$("#dayDrw") && !$(".modal-bg") && !DIRTY) render(); }, 5 * 60000);
  // Fenster kommt wieder nach vorn (z. B. nach einer getrennten Fernsitzung): sofort frische Daten holen
  let lastWake = Date.now();
  const wake = () => { if (!document.hidden && Date.now() - lastWake > 60000) { lastWake = Date.now(); refreshNow(); } };
  document.addEventListener("visibilitychange", wake); window.addEventListener("focus", wake); window.addEventListener("online", wake);
  // verhindert, dass der Browser das Fenster im Hintergrund schlafen legt
  if (navigator.locks) navigator.locks.request("autoshorts-wach", () => new Promise(() => {})).catch(() => {});
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
